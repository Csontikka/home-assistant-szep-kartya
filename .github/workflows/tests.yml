name: Tests

on:
  push:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/workflows/tests.yml
      - name: Install test harness (Home Assistant 2026.9.2)
        run: pip install pytest-homeassistant-custom-component==0.13.365
      - name: Run tests
        run: pytest -q
